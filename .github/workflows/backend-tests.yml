name: Backend tests

on:
  pull_request:

# NOTE: Push-triggered backend tests were removed to avoid running CI on direct pushes
# (e.g., automated audits or bot accounts). To re-enable push-triggered tests, add:
# push:
#   branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: python -m unittest discover -s tests -v
